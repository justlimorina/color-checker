<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Extractor - Limorina Color Checker</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/amelia_logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Roboto+Slab:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
    <meta name="description" content="Upload any image to automatically extract vibrant and harmonized color palettes. Customize pins to select specific colors directly from the image.">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#624E9A">
    <link rel="apple-touch-icon" href="../assets/images/amelia_logo.svg">
</head>
<body class="light-mode">
    <header class="top-app-bar"></header>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="md-main">
        <div class="card card-elevated" style="max-width: 800px; margin: 0 auto;">
            <h2 class="headline-medium mb-m" data-i18n="image_extractor">Image Extractor</h2>
            <p class="body-medium mb-l" style="opacity: 0.8;" data-i18n="image_extractor_desc">Upload an image to extract a color palette from it.</p>
            
            <div id="image-drop-zone" class="image-drop-zone">
                <span class="material-symbols-rounded" style="font-size: 48px;">add_photo_alternate</span>
                <p class="title-medium mt-s" data-i18n="browse_image">Browse image</p>
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
            </div>

            <div id="image-extractor-workspace" style="display: none;">
                <!-- Left Column: Controls -->
                <div style="width: 250px; display: flex; flex-direction: column; gap: var(--spacing-m);">
                    <!-- Picked palettes slider -->
                    <div class="input-group">
                        <label class="label-large" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <span data-i18n="picked_palettes">Picked palettes</span>
                            <span id="picked-palette-name" class="label-small" style="font-weight: bold; color: var(--md-sys-color-primary);">Balanced</span>
                        </label>
                        <input type="range" id="picked-palettes-slider" min="0" max="4" value="4" class="custom-slider">
                    </div>

                    <!-- Palette with +/- buttons -->
                    <div class="input-group">
                        <label class="label-large" data-i18n="palette" style="display: block; margin-bottom: 8px;">Palette</label>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div id="image-extracted-palette"></div>
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <button id="palette-add-color" class="icon-button small-btn" style="border: 1px solid var(--md-sys-color-outline); border-radius: 8px; background: var(--md-sys-color-surface-container-high); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--md-sys-color-on-surface);" title="Add Color">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">add</span>
                                </button>
                                <button id="palette-remove-color" class="icon-button small-btn" style="border: 1px solid var(--md-sys-color-outline); border-radius: 8px; background: var(--md-sys-color-surface-container-high); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--md-sys-color-on-surface);" title="Remove Color">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">remove</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Action buttons -->
                    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: var(--spacing-s);">
                        <md-filled-tonal-button id="reset-image-btn" style="width: 100%;">
                            <md-icon slot="icon">restart_alt</md-icon>
                            <span data-i18n="upload_another">Upload Another</span>
                        </md-filled-tonal-button>
                        <md-filled-button id="export-extracted-palette-btn" style="width: 100%;">
                            <md-icon slot="icon">download</md-icon>
                            <span data-i18n="export_palette">Export Palette</span>
                        </md-filled-button>
                    </div>
                </div>

                <!-- Right Column: Interactive Image canvas & overlay -->
                <div style="flex: 1; min-width: 300px; display: flex; justify-content: center; align-items: flex-start;">
                    <div id="image-workspace">
                        <canvas id="image-canvas"></canvas>
                        <div id="image-pins-overlay"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="https://esm.sh/@material/web/all.js"></script>
    <script type="module" src="./script.js"></script>
</body>
</html>
